# Render Blueprint — deploys GAADIIQ so it is reachable from any location.
#
# Two services:
#   gaadiiq-api  — the FastAPI backend (apps/api)   [ALREADY DEPLOYED]
#   gaadiiq-web  — the Angular app as a static site (apps/gaadiiq-angular)
#
# IMPORTANT: gaadiiq-api already exists on Render, created by hand as a Docker
# service on the Starter plan. The definition below is written to MATCH that
# service so applying this blueprint cannot silently reconfigure it — in
# particular it must not drop it to the free plan, which sleeps after 15
# minutes of inactivity. Keep these two in step: if the live service changes,
# change this file too.
#
# To use: Render dashboard → New → Blueprint → pick this repo, and set the
# branch to the one you deploy from. Secrets marked `sync: false` are NOT in
# this file and must be entered in the dashboard once — never commit them.
#
# The database is deliberately absent: GAADIIQ uses the existing Supabase
# Postgres, so DATABASE_URL points there rather than at a Render database.

services:
  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: gaadiiq-api
    # Matches the live service: Docker (apps/api/Dockerfile), Starter plan.
    runtime: docker
    plan: starter
    region: singapore          # closest Render region to Indian users
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Browsers block the frontend from calling this API unless its origin is
      # listed here, so once the static site exists its URL must be added:
      #   ["https://<static-site>.onrender.com","http://localhost:4200","capacitor://localhost"]
      # Left unmanaged (sync: false) because a value is already set in the
      # dashboard, and declaring one here would overwrite it on every apply.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
      # Secrets — set these in the Render dashboard, not here.
      - key: DATABASE_URL
        sync: false            # Supabase connection string
      # Supabase token verification. Legacy projects sign with a shared HS256
      # secret; newer ones use asymmetric keys published at a JWKS endpoint and
      # have no secret at all. Set whichever applies — SUPABASE_URL alone is
      # enough for an asymmetric project.
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      # Comma-separated emails granted admin regardless of their stored role.
      - key: ADMIN_EMAILS
        sync: false
      - key: SECRET_KEY
        sync: false            # JWT signing key for this backend
      - key: GEMINI_API_KEY
        sync: false
      # Brochure images MUST go to object storage here. The default backend is
      # "local", which writes into the container — and this service has no
      # persistent disk, so every deploy silently deletes every image while
      # leaving the vehicle_media rows pointing at them. That is what turned
      # the review screen into a grid of broken thumbnails.
      - key: MEDIA_BACKEND
        value: s3
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      # Public base for served images. Without it the S3 backend still stores
      # correctly but has no browser-reachable URL to hand back.
      - key: R2_PUBLIC_URL
        sync: false
      # Free hosted vision fallback for brochure pages, currently not in use.
      #
      # Uncomment when a Groq key is available. The code already treats an
      # absent key as "skip this provider", so leaving it out costs nothing —
      # but it does mean Gemini has no fallback: if Gemini is throttled or
      # down, brochure extraction fails rather than degrading, because the
      # only other provider is Ollama and nothing hosts it here.
      # - key: GROQ_API_KEY
      #   sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

      # ── Optional subsystems ────────────────────────────────────────────────
      #
      # Declared here even though they are unset, because their absence is
      # invisible at runtime: each one degrades quietly instead of failing, and
      # that is exactly how the architecture documents came to describe
      # OpenSearch as deployed while every query went to Postgres.
      #
      # Leaving a key undeclared makes "we chose not to run this" and "nobody
      # noticed this was never provisioned" look identical. Declared and empty,
      # they are a visible list of decisions. `GET /health/dependencies` reports
      # which backend is actually answering.
      #
      # OpenSearch — full-text listing search. Without it services/search_index.py
      # probes once and falls back to a Postgres LIKE query.
      - key: OPENSEARCH_URL
        sync: false
      # Redis — OTP digests and the diagnosis response cache. Without it both
      # use a per-process dict: correct, but not shared across workers or
      # restarts, so the cache hit rate collapses and OTPs break across replicas.
      - key: REDIS_URL
        sync: false
      # Ollama — the free-tier diagnosis engine, vision, valuation and sentiment.
      # Defaults to localhost:11434, which is unreachable here, so all four lose
      # their model.
      - key: OLLAMA_BASE_URL
        sync: false
      # Aadhaar and OTP digest pepper. Only fatal at startup when
      # MARKETPLACE_ENABLED is on — see core/config.py — but the digests are
      # weaker without it either way.
      - key: KYC_HASH_PEPPER
        sync: false

  # ── Angular frontend ───────────────────────────────────────────────────────
  - type: web
    name: gaadiiq-web
    runtime: static
    plan: free
    # Built from the repo root, NOT from apps/gaadiiq-angular. This is an npm
    # workspaces monorepo: the only package-lock.json lives at the root, so
    # `npm ci` inside the app directory fails outright with "can only install
    # with an existing package-lock.json". Installing at the root also hoists
    # shared dependencies exactly as local development does.
    buildCommand: npm ci && npm run build --workspace=gaadiiq-angular
    staticPublishPath: apps/gaadiiq-angular/dist/gaadiiq-angular/browser
    routes:
      # Angular routing is client-side: a hard refresh on /new-cars asks Render
      # for a file that does not exist. Without this rewrite every deep link
      # 404s, and only the home page works.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
