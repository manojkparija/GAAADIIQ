# Render Blueprint — deploys GAADIIQ so it is reachable from any location.
#
# Two services:
#   gaadiiq-api  — the FastAPI backend (apps/api)   [ALREADY DEPLOYED]
#   gaadiiq-web  — the Angular app as a static site (apps/gaadiiq-angular)
#
# IMPORTANT: gaadiiq-api already exists on Render, created by hand as a Docker
# service on the Starter plan. The definition below is written to MATCH that
# service so applying this blueprint cannot silently reconfigure it — in
# particular it must not drop it to the free plan, which sleeps after 15
# minutes of inactivity. Keep these two in step: if the live service changes,
# change this file too.
#
# To use: Render dashboard → New → Blueprint → pick this repo, and set the
# branch to the one you deploy from. Secrets marked `sync: false` are NOT in
# this file and must be entered in the dashboard once — never commit them.
#
# The database is deliberately absent: GAADIIQ uses the existing Supabase
# Postgres, so DATABASE_URL points there rather than at a Render database.

services:
  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: gaadiiq-api
    # Matches the live service: Docker (apps/api/Dockerfile), Starter plan.
    runtime: docker
    plan: starter
    region: singapore          # closest Render region to Indian users
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Browsers block the frontend from calling this API unless its origin is
      # listed here, so once the static site exists its URL must be added:
      #   ["https://<static-site>.onrender.com","http://localhost:4200","capacitor://localhost"]
      # Left unmanaged (sync: false) because a value is already set in the
      # dashboard, and declaring one here would overwrite it on every apply.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
      # Cloudflare origin lock — see docs/CLOUDFLARE.md.
      #
      # Both left unmanaged so they are turned on deliberately, from the
      # dashboard, once Cloudflare is actually in front and its Transform Rule is
      # injecting the header. A lock that activates on deploy against a service
      # Cloudflare is not yet fronting refuses every request — a total outage,
      # self-inflicted, on the exact release meant to harden things.
      #
      # Until TRUSTED_PROXY_SECRET is set, CF-Connecting-IP is not trusted at
      # all and the limiter keys on X-Forwarded-For counted from the right,
      # which is correct behind Render on its own.
      - key: TRUSTED_PROXY_SECRET
        sync: false
      - key: REQUIRE_TRUSTED_PROXY
        sync: false
      # Environment mismatch check — warn-only until deliberately turned on.
      #
      # The check runs unconditionally at startup and logs ENVIRONMENT MISMATCH
      # when what we are connected to disagrees with what we called ourselves.
      # Setting this to true makes it refuse to boot instead. Leave it unset
      # until the log has been read against a real deployment: it reasons from
      # the database host, which is a heuristic, and a refuse-to-boot heuristic
      # that is wrong takes the service down on the release meant to harden it.
      - key: STRICT_ENVIRONMENT_CHECK
        sync: false
      # Secrets — set these in the Render dashboard, not here.
      - key: DATABASE_URL
        sync: false            # Supabase connection string
      # Supabase token verification. Legacy projects sign with a shared HS256
      # secret; newer ones use asymmetric keys published at a JWKS endpoint and
      # have no secret at all. Set whichever applies — SUPABASE_URL alone is
      # enough for an asymmetric project.
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      # Comma-separated emails granted admin regardless of their stored role.
      - key: ADMIN_EMAILS
        sync: false
      - key: SECRET_KEY
        sync: false            # JWT signing key for this backend
      # The two models below the diagnosis knowledge base, tried in this order.
      # OPENAI_API_KEY also powers server-side speech-to-text below, so one key
      # covers both.
      #
      # With NEITHER set, a symptom that misses the knowledge base reaches the
      # heuristic fallback — an answer assembled from keyword overlap, not a
      # diagnosis. `GET /health/dependencies` reports `diagnosis_model:
      # heuristic-only` when that is the state, so it is visible rather than
      # inferred from a quiet log.
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Server-side speech-to-text. The browser's Web Speech API is the primary
      # engine; this is the fallback for Android WebView, Safari and Firefox,
      # which have no usable one. Left as "none" the endpoint returns 503 and
      # those clients have no voice input at all.
      #
      # "openai" here means Whisper via the same key as above.
      - key: STT_PROVIDER
        value: openai
      - key: STT_API_KEY
        sync: false
      # Brochure images MUST go to object storage here. The default backend is
      # "local", which writes into the container — and this service has no
      # persistent disk, so every deploy silently deletes every image while
      # leaving the vehicle_media rows pointing at them. That is what turned
      # the review screen into a grid of broken thumbnails.
      - key: MEDIA_BACKEND
        value: s3
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      # Public base for served images. Without it the S3 backend still stores
      # correctly but has no browser-reachable URL to hand back.
      - key: R2_PUBLIC_URL
        sync: false
      # Free hosted vision fallback for brochure pages, currently not in use.
      #
      # Uncomment when a Groq key is available. The code already treats an
      # absent key as "skip this provider", so leaving it out costs nothing —
      # but it does mean Gemini has no fallback: if Gemini is throttled or
      # down, brochure extraction fails rather than degrading, because the
      # only other provider is Ollama and nothing hosts it here.
      # - key: GROQ_API_KEY
      #   sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

      # ── Optional subsystems ────────────────────────────────────────────────
      #
      # Declared here even though they are unset, because their absence is
      # invisible at runtime: each one degrades quietly instead of failing, and
      # that is exactly how the architecture documents came to describe
      # OpenSearch as deployed while every query went to Postgres.
      #
      # Leaving a key undeclared makes "we chose not to run this" and "nobody
      # noticed this was never provisioned" look identical. Declared and empty,
      # they are a visible list of decisions. `GET /health/dependencies` reports
      # which backend is actually answering.
      #
      # OpenSearch — full-text listing search. Without it services/search_index.py
      # probes once and falls back to a Postgres LIKE query.
      - key: OPENSEARCH_URL
        sync: false
      # Redis — OTP digests and the diagnosis response cache. Without it both
      # use a per-process dict: correct, but not shared across workers or
      # restarts, so the cache hit rate collapses and OTPs break across
      # replicas.
      #
      # This was `sync: false` and was never filled in, which is exactly the
      # failure mode a blueprint should prevent: a secret nobody has to set is
      # a secret nobody forgets. It is wired to the key-value service declared
      # at the bottom of this file instead, so applying the blueprint
      # provisions the instance and injects its connection string.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gaadiiq-cache
          property: connectionString
      # Ollama — the free-tier diagnosis engine, vision, valuation and sentiment.
      # Defaults to localhost:11434, which is unreachable here, so all four lose
      # their model.
      - key: OLLAMA_BASE_URL
        sync: false
      # Aadhaar and OTP digest pepper. Only fatal at startup when
      # MARKETPLACE_ENABLED is on — see core/config.py — but the digests are
      # weaker without it either way.
      - key: KYC_HASH_PEPPER
        sync: false

      # ── Set in the dashboard before this file knew about them ─────────────
      #
      # Every key below was already live on gaadiiq-api and named nowhere in
      # this blueprint. That is the drift this header warns about — "Keep these
      # two in step: if the live service changes, change this file too" — and
      # it had been left for long enough that the file no longer described what
      # the service needs to run.
      #
      # They are declared now, before the blueprint is applied for the first
      # time, because an apply reconciles the service against this file and an
      # undeclared variable is the one thing nobody can argue is protected.
      # Whether Render actually prunes unmanaged keys is beside the point: the
      # cost of being wrong is JWT keys disappearing from a live API, and the
      # cost of declaring them is three lines each.
      #
      # All `sync: false`, so no secret enters the repository and no live value
      # is touched. Declaring a key this way changes nothing at runtime — it
      # only tells Render the key is ours and its value is not managed here.

      # Auth. The API signs and verifies its own tokens with these; without
      # them every signed-in request fails.
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false

      # Google Places, server side — services/ev_charging/providers.py. Its own
      # comment explains why the browser key cannot be reused. Absent, the EV
      # charging map reports "no directory connected" rather than failing, so
      # losing this is quiet.
      - key: GOOGLE_MAPS_SERVER_KEY
        sync: false

      # OTP delivery over SMS (routers/otp.py). otp.py raises in production
      # when it is missing, so losing this breaks every phone verification —
      # which now includes the enquiry forms from #289 and #291.
      #
      # MSG91_TEMPLATE_ID is read beside it and is deliberately NOT declared:
      # see the note at the end of this block about keys that may not be set.
      - key: MSG91_AUTH_KEY
        sync: false

      # Cloudflare purge-on-write (services/cdn_purge.py). More load-bearing
      # since #298: with the cache-busting parameter gone, the edge holds the
      # catalogue for an hour and this purge is what makes an admin edit appear
      # in seconds. A purge failure is logged and swallowed, so losing these
      # looks like nothing at all until someone asks why a change is invisible.
      - key: CLOUDFLARE_ZONE_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false

      # Transactional email (services/email.py). Falls back silently when
      # SMTP_HOST is unset — the one failure here that says nothing in a log.
      #
      # SMTP_PASSWORD is the name the dashboard uses. config.py declares
      # SMTP_PASS, so the two do not meet and the password the dashboard holds
      # is not the one the code reads. That is a live bug, older than this
      # change and not fixed by it: declared here under the dashboard's
      # spelling so an apply cannot delete the value while it is sorted out.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_PASSWORD
        sync: false

      # The R2 bucket's region, read beside the four R2 keys declared above.
      - key: MEDIA_S3_REGION
        sync: false

      # Prometheus scrape token (main.py). Without it /metrics mints an
      # ephemeral token that changes on every restart, so scraping breaks
      # silently rather than loudly.
      - key: METRICS_TOKEN
        sync: false

      # Which Gemini model services/gemini_gateway.py asks for.
      - key: GEMINI_MODEL
        sync: false

      # WHAT IS DELIBERATELY NOT DECLARED, AND WHY THAT IS NOT CARELESSNESS
      #
      # Only keys confirmed present on the live service are listed above. A
      # `sync: false` key that is NOT already set is prompted for when the
      # blueprint is applied, and answering it blank creates the variable with
      # an empty value — which is not the same as leaving it unset. SMTP_FROM
      # shows why that matters: config.py defaults it to noreply@gaadiiq.com,
      # and an empty value would override that default rather than fall back
      # to it. Declaring a key "just in case" can therefore cause the breakage
      # this block exists to prevent.
      #
      # So SMTP_USER, SMTP_PASS, SMTP_FROM and MSG91_TEMPLATE_ID are read by
      # the code and left out here. If the dashboard does hold them, add them
      # in the same style before applying; the list above was taken from what
      # the dashboard was seen to contain, which is a screenshot and not an
      # export.

  # ── Cache ──────────────────────────────────────────────────────────────────
  #
  # Backs the diagnosis response cache and the OTP digest store. Declared here
  # rather than left to a dashboard entry because the dashboard entry was never
  # made: the API ran for months on the per-process fallback, which is correct
  # but survives neither a restart nor a second worker.
  #
  # Same region as the API — a cache reached across regions costs more in
  # latency than the lookup it replaces.
  - type: keyvalue
    name: gaadiiq-cache
    plan: starter
    region: singapore
    # Reachable only from services in this Render account. The cache holds
    # OTP digests; it must not be open to the internet.
    ipAllowList: []
    # allkeys-lru, because everything stored here is derived data with a TTL.
    # Evicting a diagnosis answer costs one recomputation; refusing a write
    # under memory pressure would fail the request that needed it.
    maxmemoryPolicy: allkeys-lru

  # ── Angular frontend ───────────────────────────────────────────────────────
  - type: web
    name: gaadiiq-web
    runtime: static
    plan: free
    # Built from the repo root, NOT from apps/gaadiiq-angular. This is an npm
    # workspaces monorepo: the only package-lock.json lives at the root, so
    # `npm ci` inside the app directory fails outright with "can only install
    # with an existing package-lock.json". Installing at the root also hoists
    # shared dependencies exactly as local development does.
    buildCommand: npm ci && npm run build --workspace=gaadiiq-angular
    staticPublishPath: apps/gaadiiq-angular/dist/gaadiiq-angular/browser
    routes:
      # Angular routing is client-side: a hard refresh on /new-cars asks Render
      # for a file that does not exist. Without this rewrite every deep link
      # 404s, and only the home page works.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
