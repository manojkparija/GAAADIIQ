# Render Blueprint — deploys GAADIIQ so it is reachable from any location.
#
# Two services:
#   gaadiiq-api  — the FastAPI backend (apps/api)
#   gaadiiq-web  — the Angular app as a static site (apps/gaadiiq-angular)
#
# To use: Render dashboard → New → Blueprint → pick this repo. Render reads
# this file and creates both services. Secrets marked `sync: false` are NOT in
# this file and must be entered in the dashboard once — never commit them.
#
# The database is deliberately absent: GAADIIQ uses the existing Supabase
# Postgres, so DATABASE_URL points there rather than at a Render database.

services:
  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: gaadiiq-api
    runtime: python
    plan: free
    region: singapore          # closest Render region to Indian users
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    # Render supplies $PORT and expects the process to bind it on 0.0.0.0.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # Browsers block the frontend from calling this API unless its origin is
      # listed here. Update after the static site's URL is known.
      - key: ALLOWED_ORIGINS
        value: '["https://gaadiiq-web.onrender.com","http://localhost:4200","capacitor://localhost"]'
      - key: ENVIRONMENT
        value: production
      # Secrets — set these in the Render dashboard, not here.
      - key: DATABASE_URL
        sync: false            # Supabase connection string
      - key: SUPABASE_JWT_SECRET
        sync: false            # required for admins to get the Gemini tier
      - key: SECRET_KEY
        sync: false            # JWT signing key for this backend
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # ── Angular frontend ───────────────────────────────────────────────────────
  - type: web
    name: gaadiiq-web
    runtime: static
    plan: free
    rootDir: apps/gaadiiq-angular
    buildCommand: npm ci && npm run build -- --configuration production
    staticPublishPath: dist/gaadiiq-angular/browser
    routes:
      # Angular routing is client-side: a hard refresh on /new-cars asks Render
      # for a file that does not exist. Without this rewrite every deep link
      # 404s, and only the home page works.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
