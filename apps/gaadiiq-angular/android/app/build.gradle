apply plugin: 'com.android.application'

// Release signing credentials, read from the environment — never from a file in
// the repo.
//
// A keystore is the app's identity: whoever holds it can publish an update that
// Android accepts as genuinely yours, and it cannot be rotated once the app is
// on the Play Store. So it is not committed, not generated by tooling, and not
// printed anywhere. CI supplies it as a base64 secret written to a temporary
// file and deleted afterwards.
//
// Declared at the top level rather than inside `android { }` so the scoping is
// the conventional one and does not depend on closure delegation.
def keystorePath     = System.getenv('ANDROID_KEYSTORE_PATH')
def keystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def keyAliasEnv      = System.getenv('ANDROID_KEY_ALIAS')
def keyPasswordEnv   = System.getenv('ANDROID_KEY_PASSWORD')

// Absent credentials are not an error: `assembleDebug` must keep working for
// anyone who has never set this up — every contributor, and the debug-APK job.
def hasSigning = keystorePath && keystorePassword && keyAliasEnv && keyPasswordEnv

// The build number Play orders submissions by.
//
// It was the literal 1. Play rejects a re-upload at a versionCode it has
// already seen, so the second submission would have been refused with a
// message about the number rather than about anything a developer changed —
// and the fix is a hand edit somebody has to remember on every release.
//
// CI passes the workflow run number, which only ever increases. Locally, and
// for anyone who has never set this up, it falls back to 1 so `assembleDebug`
// keeps working unchanged.
//
// Deliberately not derived from versionName: the two answer different
// questions. versionName is what a person reads ("1.4.2"); versionCode is an
// ordering Play enforces, and a scheme that computes one from the other breaks
// the day a hotfix has to go out ahead of a version that was already uploaded.
def versionCodeEnv = System.getenv('ANDROID_VERSION_CODE')
def resolvedVersionCode = versionCodeEnv ? versionCodeEnv.toInteger() : 1
def resolvedVersionName = System.getenv('ANDROID_VERSION_NAME') ?: '1.0'

android {
    namespace = "com.gaadiiq.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.gaadiiq.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasEnv
                keyPassword keyPasswordEnv
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Unsigned when unconfigured, rather than silently falling back to
            // the debug key. A release build signed with Android's universal
            // debug key looks finished and can never be uploaded to Play — far
            // better for the build to produce an obviously unsigned artifact.
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
