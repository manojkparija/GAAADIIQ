<div class="vm-overlay" [class.active]="step() !== 'idle'">
  <div class="vm-panel">

    <!-- Header -->
    <div class="vm-header">
      <span class="vm-title">🎤 Voice Diagnosis</span>
      <button class="vm-close" (click)="cancel()" aria-label="Close voice mode">✕</button>
    </div>

    <!-- Waveform / Mic indicator -->
    <div class="vm-visual" [class.listening]="isListening()">
      <div class="vm-pulse-ring"></div>
      <div class="vm-mic-icon">{{ isListening() ? '🎙️' : '🔇' }}</div>
      <div class="vm-status-label">
        {{ isListening() ? 'Listening…' : (voice.speakingState() === 'speaking' ? 'Speaking…' : 'Tap mic to speak') }}
      </div>
    </div>

    <!-- Language badge -->
    <div class="vm-lang-badge" *ngIf="voice.autoDetectedLanguage() as lang">
      <span>Detected: {{ lang.native }} ({{ lang.label }})</span>
    </div>

    <!-- AI message bubble -->
    <div class="vm-ai-bubble" *ngIf="aiMessage()">
      <p>{{ aiMessage() }}</p>
      <button class="vm-replay" (click)="replayLast()" title="Replay">🔄</button>
    </div>

    <!-- Conversation transcript -->
    <div class="vm-transcript" *ngIf="messages().length > 0">
      <div
        *ngFor="let msg of messages()"
        class="vm-msg"
        [class.vm-msg--ai]="msg.role === 'ai'"
        [class.vm-msg--user]="msg.role === 'user'"
      >{{ msg.text }}</div>
    </div>

    <!-- STT error -->
    <div class="vm-error" *ngIf="voice.errorMessage()">
      <span>⚠️ {{ voice.errorMessage() }}</span>
      <button (click)="voice.dismissError()">✕</button>
    </div>

    <!-- Interim text -->
    <div class="vm-interim" *ngIf="voice.interimText()">
      {{ voice.interimText() }}
    </div>

    <!-- CTA -->
    <div class="vm-actions">
      <button
        *ngIf="step() !== 'done'"
        class="vm-btn vm-btn--danger"
        (click)="cancel()"
      >Cancel</button>
    </div>

  </div>
</div>
