<div class="reset-page">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="reset-card glass-card">
      <a routerLink="/" class="logo-link" aria-label="GAADIIQ — Home">
        <app-logo [width]="170" [height]="38"></app-logo>
      </a>

    <!-- Invalid / expired link -->
    <ng-container *ngIf="invalidLink()">
      <div class="state-box">
        <div class="state-icon">🔗</div>
        <h1>Invalid reset link</h1>
        <p>This password reset link is invalid or has expired. Please request a new one.</p>
        <a routerLink="/login" class="btn-gradient btn-full">Back to Sign In</a>
      </div>
    </ng-container>

    <!-- Success -->
    <ng-container *ngIf="success()">
      <div class="state-box">
        <div class="state-icon"><app-icon name="check-circle" [size]="40"></app-icon></div>
        <h1>Password updated!</h1>
        <p>Your password has been changed successfully. Redirecting you to sign in…</p>
      </div>
    </ng-container>

    <!-- Form -->
    <ng-container *ngIf="!invalidLink() && !success()">
      <h1>Set new password</h1>
      <p class="sub">Choose a strong password for your account.</p>

      <form (ngSubmit)="onSubmit()" class="reset-form">
        <div class="form-group">
          <label>New password</label>
          <div class="pass-input">
            <input [type]="showPass() ? 'text' : 'password'" [ngModel]="password()" (ngModelChange)="password.set($event)"
              name="password" placeholder="At least 8 characters" required>
            <button type="button" class="show-pass" (click)="toggleShowPass()">{{ showPass() ? '🙈' : '👁' }}</button>
          </div>
        </div>
        <div class="form-group">
          <label>Confirm password</label>
          <input type="password" [ngModel]="confirm()" (ngModelChange)="confirm.set($event)"
            name="confirm" placeholder="Re-enter password" required>
        </div>
        <div class="error-msg" *ngIf="error()">⚠️ {{ error() }}</div>
        <button type="submit" class="btn-gradient btn-full" [disabled]="loading()">
          {{ loading() ? 'Updating…' : 'Update Password' }}
        </button>
      </form>
    </ng-container>
  </div>
</div>
