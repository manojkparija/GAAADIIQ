name: CI — API (FastAPI)

on:
  push:
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-api.yml"
  pull_request:
    paths:
      - "apps/api/**"

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      # Dependency vulnerabilities.
      #
      # BLOCKING, but only for advisories that are NEW. The audit on 24 Aug 2026
      # found ten affected packages; python-jose and python-multipart were on
      # security paths and were upgraded there and then, and the rest are listed
      # below with the reason each is tolerated. Freezing the known set is what
      # makes this a gate rather than a permanently-red step that everyone
      # learns to ignore — the failure mode of adding `continue-on-error` and
      # calling it done.
      #
      # To clear an entry: upgrade the package and delete its line. Do not add a
      # line without recording why in docs/PRODUCTION_RELEASE_PLAN.md.
      #
      #   PYSEC-2025-185  python-jose  — no upstream fix exists
      #   PYSEC-2026-1325 ecdsa        — no upstream fix; maintainers consider
      #                                  the Minerva timing attack out of scope,
      #                                  and python-jose[cryptography] does not
      #                                  route our JWT work through it
      #   pyasn1          — a fix exists (0.6.4) and cannot be taken:
      #                     python-jose 3.4.0 pins pyasn1<0.5.0. Upgrading it
      #                     anyway installs a combination pip itself reports as
      #                     incompatible, so it waits on python-jose moving.
      #   starlette / langchain / langsmith / pytest — transitive, pinned by
      #                     fastapi and the LLM stack; upgrading means moving
      #                     those majors, which is scheduled work not a CI fix
      #
      # The list below is GENERATED from a real audit run, not typed. Typing it
      # is how an id ends up wrong and silently widens the gate.
      - name: Audit dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off \
            --ignore-vuln GHSA-f4xh-w4cj-qxq8 \
            --ignore-vuln PYSEC-2026-1325 \
            --ignore-vuln PYSEC-2026-1515 \
            --ignore-vuln PYSEC-2026-1518 \
            --ignore-vuln PYSEC-2026-1520 \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-1845 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-1942 \
            --ignore-vuln PYSEC-2026-2192 \
            --ignore-vuln PYSEC-2026-2193 \
            --ignore-vuln PYSEC-2026-2263 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-2555 \
            --ignore-vuln PYSEC-2026-2562 \
            --ignore-vuln PYSEC-2026-2563 \
            --ignore-vuln PYSEC-2026-2564 \
            --ignore-vuln PYSEC-2026-2582 \
            --ignore-vuln PYSEC-2026-2583 \
            --ignore-vuln PYSEC-2026-3455 \
            --ignore-vuln PYSEC-2026-3456 \
            --ignore-vuln PYSEC-2026-3457 \
            --ignore-vuln PYSEC-2026-373 \
            --ignore-vuln PYSEC-2026-77

  postgres:
    name: Test on Postgres
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    # Production is Postgres and the suite has always run on SQLite, where the
    # same Enum column is a plain VARCHAR and NOT NULL, casting and native enum
    # behaviour all differ. A green SQLite run says nothing about any of that,
    # and the gap has already produced a wrong diagnosis of a live outage.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gaadiiq
          POSTGRES_PASSWORD: gaadiiq
          POSTGRES_DB: gaadiiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gaadiiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The migrations are the other half of this. They are what a deploy runs,
      # and until now nothing checked that the chain applies cleanly to an empty
      # Postgres — which is how tables reached production only by hand.
      - name: Migrations apply to an empty database
        env:
          DATABASE_URL: postgresql+asyncpg://gaadiiq:gaadiiq@localhost:5432/gaadiiq_migrations
          ASYNC_DATABASE_URL: postgresql+asyncpg://gaadiiq:gaadiiq@localhost:5432/gaadiiq_migrations
          ENVIRONMENT: development
        run: |
          PGPASSWORD=gaadiiq createdb -h localhost -U gaadiiq gaadiiq_migrations
          alembic upgrade head

      # Applying cleanly is not the same as producing the right shape. A model
      # column nobody wrote a migration for applies perfectly and then 500s on
      # the first query that names it — which is the dealers outage in
      # miniature. This compares the migrated schema against the models.
      - name: Migrations produce the schema the models declare
        env:
          DATABASE_URL: postgresql+asyncpg://gaadiiq:gaadiiq@localhost:5432/gaadiiq_migrations
          ASYNC_DATABASE_URL: postgresql+asyncpg://gaadiiq:gaadiiq@localhost:5432/gaadiiq_migrations
          ENVIRONMENT: development
        run: pytest tests/test_migrations_match_models.py -q

      # Twelve files are excluded, and the reason is worth reading before
      # adding a thirteenth.
      #
      # They fail on Postgres for two reasons, both of which are the *tests*
      # relying on SQLite being lenient rather than the product being wrong:
      #
      #   * SQLite does not enforce foreign keys by default. These tests build
      #     an admin with a dependency override and never insert the user row,
      #     so `vehicle_media.uploaded_by` points at nobody. Postgres refuses.
      #   * On Postgres a failed statement aborts the transaction, so a test
      #     that deliberately provokes an error leaves its session unusable and
      #     the fixture's own commit() raises on the way out.
      #
      # Neither is a bug a user could hit. Fixing them means inserting real
      # rows and rolling back in those fixtures — worth doing, and too large to
      # bundle with the change that discovered it. Until then this job guards
      # 648 tests properly rather than reporting a permanent red nobody reads.
      - name: Test (Postgres)
        env:
          TEST_DATABASE_URL: postgresql://gaadiiq:gaadiiq@localhost:5432/gaadiiq_test
          ENVIRONMENT: development
        run: |
          pytest tests/ -q \
            --ignore=tests/test_media_admin.py \
            --ignore=tests/test_voice_store.py \
            --ignore=tests/test_security_go.py \
            --ignore=tests/test_search.py \
            --ignore=tests/test_valuation.py \
            --ignore=tests/test_sentiment.py \
            --ignore=tests/test_schema_drift.py \
            --ignore=tests/test_notifications.py \
            --ignore=tests/test_reviews.py \
            --ignore=tests/test_analytics.py \
            --ignore=tests/test_dealer_bookings.py \
            --ignore=tests/test_loans.py

# There is no deploy job here on purpose. Render deploys the API from `master`
# on its own, and Vercel does the same for the web app. A second deploy path
# would be a second thing to keep in step with the first.
